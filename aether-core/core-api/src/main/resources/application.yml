spring:
  application:
    name: aether-core
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aether_core}
    username: ${POSTGRES_USER:aether}
    password: ${POSTGRES_PASSWORD:aether}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aether:
  core:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding:
      enabled: ${EMBEDDING_ENABLED:true}
      model: ${EMBEDDING_MODEL:all-minilm}
    context:
      memory-limit: ${CONTEXT_MEMORY_LIMIT:5}
    feedback:
      enabled: ${FEEDBACK_ENABLED:false}
      topic: ${FEEDBACK_TOPIC:aether.core.feedback}
      group-id: ${FEEDBACK_GROUP_ID:aether-core}
